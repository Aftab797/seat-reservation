version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seatuser
      POSTGRES_PASSWORD: seatpassword
      POSTGRES_DB: seatdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatuser -d seatdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/seatdb
      SPRING_DATASOURCE_USERNAME: seatuser
      SPRING_DATASOURCE_PASSWORD: seatpassword
    depends_on:
      postgres:
        condition: service_healthy

