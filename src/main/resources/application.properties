spring.application.name=seat-reservation

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seatdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:seatuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:seatpassword}

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always


server.port=${PORT:8080}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT:3000}